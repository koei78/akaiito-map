<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="csrf-token" content="{{ session.csrf }}"><link rel="stylesheet" href="{{ url_for('static', filename='pins.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='account.css') }}">
<link rel="manifest" href="/static/manifest.webmanifest?v=3"><link rel="apple-touch-icon" href="/static/app-icon-192.png?v=3"><meta name="theme-color" content="#2e7656"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="/static/install-gate.css"><script src="/static/install-gate.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#192023;color:#f2f6f4;font:14px system-ui,sans-serif}#map{position:fixed!important;inset:0;width:100%;height:100%}.bar{position:absolute;z-index:1;top:12px;left:12px;right:12px;display:flex;align-items:center;gap:12px;padding:12px;background:#202a29f2;border-radius:13px;box-shadow:0 5px 20px #0007;flex-wrap:wrap}.bar h1{font-size:15px;margin:0 8px 0 0}.bar a{color:#a6ddce}.bar button{border:0;border-radius:8px;background:#87d1bd;color:#123229;padding:10px 14px;cursor:pointer;font-weight:700}.bar button:disabled{opacity:.4}.bar input{accent-color:#87d1bd}.status{color:#c6d5ce;font-size:12px}.legend{font-size:11px;color:#b7c8c0}@media(max-width:650px){.bar{gap:8px}.bar h1{width:100%}.status{width:100%}#map{inset:0}}
.bar{z-index:3}
@media(max-width:650px){.bar{top:8px;left:8px;right:8px;gap:6px;padding:8px;max-height:40dvh;overflow:auto;border-radius:10px}.bar h1{font-size:13px;margin:0}.bar select,.bar button{min-height:38px;font-size:12px}.bar button{padding:8px 10px;flex:1 1 auto}.bar label{font-size:11px}.bar .status{order:10;max-height:36px;overflow:auto;font-size:11px}.bar .legend{display:none}#downloads{font-size:11px}#draw-surface{touch-action:none}}

</style><link rel="stylesheet" href="{{ url_for('static', filename='mobile-map.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='map-theme.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='detection-history.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='mobile-refresh.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='imported-markers.css') }}"></head><body><div id="map"></div><div id="draw-surface" hidden style="position:fixed;inset:0;z-index:2;touch-action:none;cursor:crosshair"><svg id="draw-svg" style="width:100%;height:100%;pointer-events:none"><polyline id="draw-line" fill="none" stroke="#ff3636" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="bar"><h1>航空写真の比較</h1><select id="imagery" aria-label="地図の種類"><option value="roadmap">Googleマップ</option><option value="satellite">Google航空写真</option><option value="esri">Esriの航空写真</option><option value="gsi">国土地理院の航空写真</option></select><label>比較時期 <input id="years" type="range" min="1" max="40" value="15"><output id="years-value">15年前</output></label><label>AI設定 <select id="ai-level"><option value="medium">通常</option><option value="high">高精度（時間・使用量増）</option></select></label><button id="draw">自由に囲む</button><button id="start" disabled>比較する</button><button id="locate">現在地を表示</button><button id="route">徒歩で巡回する</button><button id="route-two" type="button">2人で徒歩巡回</button><button id="route-share" type="button" hidden>2人の経路を共有</button><input id="route-link" type="text" readonly hidden aria-label="共有リンク"><span class="legend">経路: OSRM / OpenStreetMap</span><span id="downloads" hidden><a href="/vertices.csv">頂点CSV</a> <a href="/outlines.geojson">外周GeoJSON</a></span><span class="status" id="status">地図をドラッグして移動できます。</span><span class="legend">赤：再確認済み ／ オレンジ：要確認</span><span class="legend" id="dateinfo">航空写真：Google（撮影日は特定できません）｜建物外周：候補照合に使用（個別の更新日不明）</span></div>
{% if not google_key %}
<script>document.getElementById('status').textContent='Google Maps APIキーが設定されていません。';</script>
{% else %}
<script>
let map, projection, region=null, drawing=false, active=false, vertices=[], selection=null, results=[], timer=null, comparisonActive=false, routeLine=null, routeMarkers=[], currentPoints=[];
const statusEl=document.getElementById('status'), start=document.getElementById('start'), years=document.getElementById('years');
years.oninput=()=>document.getElementById('years-value').textContent=years.value+'年前';
const aiLevel=document.getElementById('ai-level');aiLevel.value=sessionStorage.getItem('aerial_ai_effort')==='high'?'high':'medium';aiLevel.onchange=()=>sessionStorage.setItem('aerial_ai_effort',aiLevel.value);
function initMap(){
 let view;try{view=JSON.parse(sessionStorage.getItem('aerial_view'));}catch(e){}
 const valid=view&&Number.isFinite(view.lat)&&Number.isFinite(view.lng)&&Number.isFinite(view.zoom);
 map=new google.maps.Map(document.getElementById('map'),{center:valid?{lat:view.lat,lng:view.lng}:{lat:35.5066,lng:137.816433333},zoom:valid?view.zoom:18,mapTypeId:new URLSearchParams(location.search).get('map')==='satellite'?'satellite':'roadmap',streetViewControl:false,mapTypeControl:false,fullscreenControl:false});
 map.addListener('idle',()=>{const c=map.getCenter();if(c)sessionStorage.setItem('aerial_view',JSON.stringify({lat:c.lat(),lng:c.lng(),zoom:map.getZoom()}));});
 projection=new google.maps.OverlayView();projection.onAdd=()=>{};projection.draw=()=>{};projection.onRemove=()=>{};projection.setMap(map);
 const layer=document.getElementById('imagery');const updateType=()=>{layer.value=map.getMapTypeId();document.getElementById('dateinfo').textContent=(layer.value==='roadmap'?'地図：Google':'航空写真：Google（撮影日は特定できません）')+'｜建物外周：候補照合に使用（個別の更新日不明）';};updateType();layer.onchange=()=>{if(layer.value==='roadmap'||layer.value==='satellite'){map.setMapTypeId(layer.value);updateType();}else location.href='/?layer='+layer.value;};
 poll();
 loadSharedRoute();
 
}
window.initMap=initMap;
window.gm_authFailure=()=>location.replace('/?google=unavailable');

// 1回の経路検索に含める建物数。件数全体には上限を設けない。
async function calculateWalkingRoute(origin, points, getTrip, progress) {
 const remaining=points.slice(), path=[], visits=[];
 let current=origin, distance=0, duration=0, batches=0;
 while(remaining.length){
  const chunk=[];
  while(chunk.length<25 && remaining.length){
   let best=0, nearest=Infinity;
   for(let i=0;i<remaining.length;i++){
    const p=remaining[i], d=Math.hypot(p.lat-current.lat,(p.lon-current.lng)*Math.cos(current.lat*Math.PI/180));
    if(d<nearest){nearest=d;best=i;}
   }
   const p=remaining.splice(best,1)[0];chunk.push(p);current={lat:p.lat,lng:p.lon};
  }
  const start=visits.length?visits[visits.length-1].position:origin;
  if(batches++)await new Promise(resolve=>setTimeout(resolve,1100));
  progress(visits.length,points.length);
  const data=await getTrip([start,...chunk.map(p=>({lat:p.lat,lng:p.lon}))]);
  const trip=data.trips?.[0], waypoints=data.waypoints;
  if(data.code!=='Ok'||!trip?.geometry?.coordinates?.length||!waypoints||waypoints.length!==chunk.length+1)throw Error('道路の経路を作成できません');
  const order=waypoints.map(w=>w.waypoint_index);
  if(order[0]!==0||new Set(order).size!==order.length||order.some(n=>!Number.isInteger(n)||n<0||n>=order.length))throw Error('経路の順序を確認できません');
  const sorted=chunk.map((point,i)=>({point,order:order[i+1]})).sort((a,b)=>a.order-b.order);
  for(const item of sorted)visits.push({point:item.point,position:{lat:item.point.lat,lng:item.point.lon}});
  current=visits[visits.length-1].position;
  path.push(...trip.geometry.coordinates.map(([lng,lat])=>({lat,lng})));
  distance+=trip.distance;duration+=trip.duration;
 }
 return {path,visits,distance,duration};
}
let twoPersonLines=[], twoPersonMarkers=[], twoPersonRoute=null, historyRoutePoints=null;
window.addEventListener('route-history-points',event=>{historyRoutePoints=event.detail;});
function showTwoRoutes(data, fit=false){
 if(routeLine){routeLine.setMap(null);routeLine=null;} routeMarkers.forEach(m=>m.setMap(null));routeMarkers=[];
 twoPersonLines.forEach(line=>line.setMap(null));twoPersonMarkers.forEach(marker=>marker.setMap(null));twoPersonLines=[];twoPersonMarkers=[];
 twoPersonMarkers.push(new google.maps.Marker({map,position:data.origin,label:'出',title:'共通の出発地'}));
 const colors=['#1a73e8','#e8710a'], bounds=new google.maps.LatLngBounds();
 data.routes.forEach((route,group)=>{
  twoPersonLines.push(new google.maps.Polyline({map,path:route.path,strokeColor:colors[group],strokeWeight:5,strokeOpacity:.9}));
  route.path.forEach(point=>bounds.extend(point));
  route.visits.forEach((visit,index)=>twoPersonMarkers.push(new google.maps.Marker({map,position:visit.position,label:{text:String(index+1),color:'white'},title:`${group+1}人目・新築候補 ${visit.number}`,icon:{path:google.maps.SymbolPath.CIRCLE,scale:12,fillColor:colors[group],fillOpacity:1,strokeColor:'white',strokeWeight:2}})));
 });
 if(fit&&!bounds.isEmpty())map.fitBounds(bounds);
 statusEl.textContent=data.routes.map((r,i)=>`${i+1}人目 ${r.visits.length}件・約${(r.distance/1000).toFixed(1)}km・約${Math.ceil(r.duration/60)}分`).join(' / ')+'（徒歩・概算）';
}
async function loadSharedRoute(){
 const token=new URLSearchParams(location.search).get('shared_route');if(!token)return;
 try{const response=await fetch('/api/shared-routes/'+encodeURIComponent(token));if(!response.ok)throw Error('共有経路を読み込めません');showTwoRoutes(await response.json(),true);}
 catch(e){statusEl.textContent=e.message;}
}
const twoButton=document.getElementById('route-two'), shareButton=document.getElementById('route-share'), routeLink=document.getElementById('route-link');
function splitRoutePoints(points, latitude){
 const latRange=Math.max(...points.map(p=>p.lat))-Math.min(...points.map(p=>p.lat));
 const lonRange=(Math.max(...points.map(p=>p.lon))-Math.min(...points.map(p=>p.lon)))*Math.cos(latitude*Math.PI/180);
 const sorted=points.slice().sort((a,b)=>latRange>=lonRange?a.lat-b.lat:a.lon-b.lon), mid=Math.ceil(points.length/2);
 return [sorted.slice(0,mid),sorted.slice(mid)];
}
twoButton.onclick=()=>{
 const bounds=map?.getBounds(), seen=new Set();
 const points=(historyRoutePoints || currentPoints).filter(p=>{if(!bounds||!bounds.contains({lat:p.lat,lng:p.lon}))return false;const key=p.lat.toFixed(6)+','+p.lon.toFixed(6);if(seen.has(key))return false;seen.add(key);return true;});
 if(points.length<2){statusEl.textContent='画面内に2件以上の新築候補が必要です。';return;}
 if(!navigator.geolocation){statusEl.textContent='この端末では現在地を取得できません。';return;}
 if(!confirm('現在地と候補の座標を徒歩経路計算のためFOSSGISのOSRMサービスに送信します。よろしいですか？'))return;
 twoButton.disabled=true;shareButton.hidden=true;routeLink.hidden=true;statusEl.textContent='現在地を取得しています。';
 navigator.geolocation.getCurrentPosition(async pos=>{
  const origin={lat:pos.coords.latitude,lng:pos.coords.longitude};
  try{
   // Spatially adjacent buildings stay together; each group receives half the buildings.
   const groups=splitRoutePoints(points,origin.lat), routes=[];
   for(let i=0;i<2;i++){
    const result=await calculateWalkingRoute(origin,groups[i],async coords=>{
     const encoded=coords.map(p=>p.lng.toFixed(6)+','+p.lat.toFixed(6)).join(';');
     const response=await fetch('https://routing.openstreetmap.de/routed-foot/trip/v1/driving/'+encoded+'?source=first&destination=last&roundtrip=false&overview=full&geometries=geojson',{referrerPolicy:'no-referrer'});
     if(!response.ok)throw Error('経路サービスが利用できません（'+response.status+'）');return response.json();
    },(done,total)=>statusEl.textContent=`${i+1}人目の徒歩経路を計算中：${done} / ${total}件`);
    routes.push({...result,visits:result.visits.map(v=>({position:v.position,number:Number(v.point.number)}))});
   }
   twoPersonRoute={origin,routes};showTwoRoutes(twoPersonRoute);shareButton.hidden=false;
  }catch(e){statusEl.textContent=e.message;}finally{twoButton.disabled=false;}
 },()=>{twoButton.disabled=false;statusEl.textContent='現在地を取得できません。ブラウザの位置情報を許可してください。';},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
};
shareButton.onclick=async()=>{
 if(!twoPersonRoute)return;shareButton.disabled=true;
 try{const response=await fetch('/api/shared-routes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(twoPersonRoute)});const data=await response.json();if(!response.ok)throw Error(data.error||'共有できません');
  const url=new URL('/google',location.origin);url.searchParams.set('shared_route',data.token);routeLink.value=url.href;routeLink.hidden=false;routeLink.focus();routeLink.select();statusEl.textContent='共有リンクをコピーして相手に送ってください。リンクには出発地と巡回先が含まれます。';
 }catch(e){statusEl.textContent=e.message;}finally{shareButton.disabled=false;}
};
const routeButton=document.getElementById('route');
routeButton.onclick=()=>{
 twoPersonLines.forEach(line=>line.setMap(null));twoPersonMarkers.forEach(marker=>marker.setMap(null));twoPersonLines=[];twoPersonMarkers=[];shareButton.hidden=true;routeLink.hidden=true;twoPersonRoute=null;
 const bounds=map?.getBounds();
 const points=currentPoints.filter(p=>bounds&&bounds.contains({lat:p.lat,lng:p.lon}));
 if(!points.length){statusEl.textContent='現在の画面内に新築候補がありません。';return;}
 if(!navigator.geolocation){statusEl.textContent='この端末では現在地を取得できません。';return;}
 if(!confirm('現在地と表示中の候補の座標を、徒歩経路計算のためFOSSGISのOSRMサービスに送信します。よろしいですか？'))return;
 routeButton.disabled=true;statusEl.textContent='現在地を取得しています。';
 navigator.geolocation.getCurrentPosition(async pos=>{
  const origin={lat:pos.coords.latitude,lng:pos.coords.longitude};
  try{
   const result=await calculateWalkingRoute(origin,points,async coords=>{
    const encoded=coords.map(p=>p.lng.toFixed(6)+','+p.lat.toFixed(6)).join(';');
    const response=await fetch('https://routing.openstreetmap.de/routed-foot/trip/v1/driving/'+encoded+'?source=first&destination=last&roundtrip=false&overview=full&geometries=geojson',{referrerPolicy:'no-referrer'});
    if(!response.ok)throw Error('経路サービスが利用できません（'+response.status+'）');
    return response.json();
   },(done,total)=>statusEl.textContent=`徒歩経路を計算中：${done} / ${total}件`);
   if(routeLine)routeLine.setMap(null);routeMarkers.forEach(m=>m.setMap(null));routeMarkers=[];
   routeLine=new google.maps.Polyline({map,path:result.path,strokeColor:'#1489ff',strokeWeight:5,strokeOpacity:.9});
   routeMarkers.push(new google.maps.Marker({map,position:origin,label:'出',title:'現在地'}));
   result.visits.forEach((visit,i)=>routeMarkers.push(new google.maps.Marker({map,position:visit.position,label:String(i+1),title:'新築候補 '+visit.point.number})));
   statusEl.textContent=`画面内 ${points.length}件を巡回：約${(result.distance/1000).toFixed(1)} km、約${Math.ceil(result.duration/60)}分（徒歩・概算）。経路: OSRM / OpenStreetMap`;
  }catch(e){statusEl.textContent=e.message;}finally{routeButton.disabled=false;}
 },()=>{routeButton.disabled=false;statusEl.textContent='現在地を取得できません。ブラウザの位置情報を許可してください。';},{enableHighAccuracy:true,timeout:15000,maximumAge:60000});
};
window.gm_authFailure=()=>{location.replace('/?google=unavailable');};
const surface=document.getElementById('draw-surface'), line=document.getElementById('draw-line');
let screenPoints=[];
document.getElementById('draw').onclick=()=>{if(!map||!projection.getProjection()){statusEl.textContent='地図を読み込み中です。少し待ってください。';return;}drawing=true;active=false;region=null;vertices=[];screenPoints=[];line.setAttribute('points','');if(selection)selection.setMap(null);selection=null;start.disabled=true;surface.hidden=false;statusEl.textContent='地図上をドラッグして囲んでください。';};
surface.addEventListener('pointerdown',e=>{if(!drawing||e.button!==0)return;e.preventDefault();active=true;screenPoints=[];vertices=[];surface.setPointerCapture(e.pointerId);});
surface.addEventListener('pointermove',e=>{if(!active)return;e.preventDefault();const rect=surface.getBoundingClientRect();const x=e.clientX-rect.left,y=e.clientY-rect.top;const pos=projection.getProjection().fromContainerPixelToLatLng(new google.maps.Point(x,y));if(!pos)return;screenPoints.push(`${x},${y}`);vertices.push([pos.lat(),pos.lng()]);line.setAttribute('points',screenPoints.join(' '));});
function finishDrawing(cancelled){if(!active)return;active=false;drawing=false;surface.hidden=true;line.setAttribute('points','');if(cancelled||vertices.length<3){statusEl.textContent='範囲を囲んでください。';return;}region=vertices;selection=new google.maps.Polygon({map,paths:vertices.map(p=>({lat:p[0],lng:p[1]})),strokeColor:'#ff3636',strokeWeight:2,fillColor:'#ff3636',fillOpacity:.1,clickable:false});start.disabled=false;statusEl.textContent='範囲を指定しました。比較するを押してください。';}
surface.addEventListener('pointerup',()=>finishDrawing(false));
surface.addEventListener('pointercancel',()=>finishDrawing(true));

start.onclick=async()=>{start.disabled=true;results.forEach(p=>p.setMap(null));results=[];try{const r=await fetch('/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({polygon:region,years:Number(years.value),ai_effort:aiLevel.value})});const d=await r.json();if(!r.ok)throw Error(d.error);comparisonActive=true;poll();}catch(e){statusEl.textContent=e.message;start.disabled=false;}};
let comparisonPhoto = null, comparisonPhotoTile = null;
async function showComparisonPhoto(tile){
 if(comparisonPhoto && comparisonPhotoTile===tile){comparisonPhoto.setMap(null);comparisonPhoto=null;comparisonPhotoTile=null;return;}
 try{const response=await fetch(`/result/${tile}/bounds`);if(!response.ok)throw Error('比較写真を読み込めません');const b=await response.json();
 if(comparisonPhoto)comparisonPhoto.setMap(null);
 comparisonPhoto=new google.maps.GroundOverlay(`/result/${tile}/photo`,b,{clickable:false});comparisonPhoto.setMap(map);comparisonPhotoTile=tile;
 }catch(e){statusEl.textContent=e.message;}
}
async function poll(){try{const d=await(await fetch('/status')).json();statusEl.textContent=d.message;const running=d.status==='running';document.getElementById('draw').disabled=running;if(!running&&comparisonActive&&d.status==='done'&&selection){selection.setMap(null);selection=null;}if(!running)comparisonActive=false;results.forEach(p=>p.setMap(null));results=[];const visible=d.points.filter(p=>p.decision==='new'&&p.outline&&p.outline.length>=3);const review=d.points.filter(p=>p.decision==='review'&&p.outline&&p.outline.length>=3);currentPoints=visible;document.getElementById('downloads').hidden=visible.length===0;for(const p of [...visible,...review]){const confirmed=p.decision==='new';const color=confirmed?'#d93025':'#f29900';let layer=new google.maps.Polygon({map,paths:p.outline.map(x=>({lat:x[0],lng:x[1]})),strokeColor:color,strokeWeight:3,fillColor:color,fillOpacity:.12});const content=document.createElement('div');content.style.color='#222';const heading=document.createElement('strong');heading.textContent=`${confirmed?'新築候補':'要確認'} ${Number(p.number)}`;const detail=document.createElement('div');detail.textContent=`比較写真の撮影日：${p.old_date} → ${p.new_date}`;const reason=document.createElement('div');reason.textContent=p.reason||'';const imageLink=document.createElement('a');imageLink.href=`/result/${Number(p.tile)}`;imageLink.target='_blank';imageLink.textContent='比較画像';const photoButton=document.createElement('button');photoButton.type='button';photoButton.textContent='比較写真を重ねる／消す';photoButton.onclick=()=>showComparisonPhoto(Number(p.tile));content.append(heading,detail,reason,imageLink,document.createElement('br'),photoButton);let info=new google.maps.InfoWindow({content});layer.addListener('click',e=>{info.setPosition(e.latLng);info.open(map);});results.push(layer);}start.disabled=running||!region;if(running){clearTimeout(timer);timer=setTimeout(poll,1500);}}catch(e){statusEl.textContent='接続できません';start.disabled=!region;}}
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key={{ google_key | urlencode }}&callback=initMap&loading=async" onerror="location.replace('/?google=unavailable')"></script>
{% endif %}
